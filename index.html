<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>台球游戏 | 纯H5版</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* 页面主体样式 */
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* 木质纹理背景 */
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%23654321" width="100" height="100"/><rect fill="%23543210" width="50" height="50"/><rect fill="%23543210" width="50" height="50" x="50" y="50"/></svg>');
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 游戏容器 */
        #gameContainer {
            position: relative;
            width: 960px;
            height: 600px;
            max-width: 95vw;
            max-height: 95vh;
            background: #2d5016;
            border: 20px solid #8b4513;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* 竖屏模式下的游戏容器 */
        @media (orientation: portrait) {
            #gameContainer {
                width: 95vw;
                height: calc(95vw * 1.6);
                max-height: 85vh;
            }
        }

        /* 游戏画布 */
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #2d5016;
        }

        /* 移动端虚拟控制器 */
        .mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        /* 竖屏模式下显示控制器 */
        @media (orientation: portrait) {
            .mobile-controls {
                display: flex;
                bottom: 15px;
            }
        }

        /* 控制按钮样式 */
        .control-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* 按钮按下效果 */
        .control-btn:active {
            transform: scale(0.9);
            background: rgba(255, 215, 0, 0.9);
        }

        /* 力度指示器 */
        .power-indicator {
            position: absolute;
            top: -25px;
            right: -10px;
            background: rgba(255, 69, 0, 0.9);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        /* 显示力度指示器 */
        .power-indicator.visible {
            display: block;
        }

        /* HUD显示（分数等信息） */
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 50;
        }

        /* 竖屏模式下的HUD */
        @media (orientation: portrait) {
            .hud {
                font-size: 16px;
                top: 8px;
                left: 8px;
                right: 8px;
            }
        }

        /* 移动端和小屏幕适配 */
        @media (max-width: 768px), (max-height: 600px) {
            .mobile-controls {
                display: flex;
            }
        }

        /* 横屏模式适配 */
        @media (orientation: landscape) and (max-height: 600px) {
            .mobile-controls {
                bottom: 10px;
            }
            .control-btn {
                width: 60px;
                height: 60px;
                font-size: 20px;
            }
        }

        /* 竖屏小屏幕优化 */
        @media (orientation: portrait) and (max-width: 480px) {
            .control-btn {
                width: 60px;
                height: 60px;
                font-size: 20px;
            }
            .hud {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- 游戏主容器 -->
    <div id="gameContainer">
        <!-- 顶部信息显示 -->
        <div class="hud">
            <div>玩家1: <span id="player1Score">0</span></div>
            <div>球数: <span id="ballCount">15</span></div>
            <div>玩家2: <span id="player2Score">0</span></div>
        </div>
        
        <!-- 游戏画布 -->
        <canvas id="gameCanvas" width="960" height="600"></canvas>
        
        <!-- 移动端虚拟控制器 -->
        <div class="mobile-controls">
            <!-- 力度调节按钮 -->
            <div style="display: flex; gap: 10px;">
                <div class="control-btn" id="powerBtn">
                    ⚡
                    <div class="power-indicator" id="powerIndicator">15</div>
                </div>
            </div>
            <!-- 击球按钮 -->
            <div class="control-btn" id="shootBtn">🎱</div>
        </div>
    </div>

    <!-- 游戏逻辑脚本 -->
    <script src="game.js"></script>
</body>
</html>
